# ============================================================
# SGB - Modulos Servicio y Cita (API REST)
# Configuracion de conexion a la base de datos y de JPA/Hibernate.
# ============================================================

# --- Conexion a MySQL/MariaDB (XAMPP) ---
# Los valores se leen de VARIABLES DE ENTORNO para no dejar credenciales
# escritas en el codigo. Si la variable no existe se usa el valor que
# aparece despues de los dos puntos, que es EXACTAMENTE la configuracion
# local que ya se usaba (XAMPP en el puerto 3307, usuario root sin clave),
# asi que el proyecto sigue arrancando igual en la maquina de desarrollo.
#
#   SGB_DB_URL       URL JDBC completa
#   SGB_DB_USER      usuario de la base de datos
#   SGB_DB_PASSWORD  contrasena de ese usuario
#
# Recomendado (ver README, seccion Seguridad): crear un usuario propio
# para la aplicacion con permisos minimos (SELECT, INSERT, UPDATE, DELETE
# sobre sgb.*) en vez de usar root.
spring.datasource.url=${SGB_DB_URL:jdbc:mysql://localhost:3307/sgb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Bogota&connectTimeout=5000&socketTimeout=30000}
spring.datasource.username=${SGB_DB_USER:root}
spring.datasource.password=${SGB_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Pool de conexiones (HikariCP, incluido por Spring Boot) ---
# Limites explicitos: maximo 10 conexiones simultaneas (suficiente para
# los 50 usuarios concurrentes del RNF12 en un entorno local), y un
# tiempo de espera corto para que un fallo de la BD se informe rapido
# (HTTP 503) en vez de dejar la peticion colgada.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.pool-name=sgb-pool
# Permite que la aplicacion arranque aunque MySQL este apagado; las
# peticiones responderan 503 hasta que la BD vuelva a estar disponible.
spring.datasource.hikari.initialization-fail-timeout=-1

# --- JPA / Hibernate ---
# ddl-auto=validate: Hibernate NO crea ni modifica tablas, solo verifica
# que las entidades Java coincidan con las tablas que ya existen en la
# base de datos 'sgb' (creada por sgb.sql). Se usa "validate" y no
# "update" a proposito: la base de datos real ya existe con datos de
# prueba (usuarios, roles) y no queremos que Hibernate la altere sola.
spring.jpa.hibernate.ddl-auto=validate
# show-sql queda APAGADO por defecto: imprimir cada consulta en consola
# llena los registros y puede exponer datos. Para depurar se puede
# encender temporalmente con la variable de entorno SGB_SHOW_SQL=true.
spring.jpa.show-sql=${SGB_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Entrada JSON ---
# Rechaza (HTTP 400) cualquier campo que no exista en el DTO, en vez de
# ignorarlo en silencio (proteccion contra asignacion masiva de campos).
spring.jackson.deserialization.fail-on-unknown-properties=true
# Rechaza decimales en campos enteros (por ejemplo, duracionMin = 12.5 o
# idServicio = 1.7), en vez de recortarlos en silencio a 12 o a 1.
spring.jackson.deserialization.accept-float-as-int=false

# --- Errores ---
# Nunca enviar trazas ni mensajes internos al cliente. Los mensajes que
# si ve el usuario los arma ManejadorErrores (com.sgb.web).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# --- Sesion (inicio de sesion de la API) ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.name=SGBSESSION
server.servlet.session.tracking-modes=cookie
# En un despliegue con HTTPS, activar tambien:
# server.servlet.session.cookie.secure=true

# --- Servidor ---
server.port=8081
# Limite del tamano de cabeceras y de formularios (proteccion basica contra
# peticiones gigantes). El tamano del cuerpo JSON lo limita FiltroSeguridad.
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=64KB

# --- Registros (logs) ---
# Cada linea incluye el identificador de correlacion de la peticion, el
# mismo que se devuelve al cliente en la cabecera X-Correlation-Id y en
# el cuerpo de los errores, para poder encontrar el detalle tecnico.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{idCorrelacion:-sin-id}] %logger{36} - %m%n
logging.level.org.hibernate.SQL=${SGB_SQL_LOG_LEVEL:WARN}
